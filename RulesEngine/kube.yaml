apiVersion: apps/v1
kind: Deployment
metadata:
  name: rulesengine
  labels:
    app: rulesengine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rulesengine
  template:
    metadata:
      labels:
        app: rulesengine
    spec:
      # Image wird nur für arm64 gebaut — auf den Raspberry-Nodes laufen lassen,
      # amd64-Nodes bleiben für leistungshungrige Anwendungen frei
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: rulesengine
          image: tschissler/rulesengine:latest
          env:
            - name: RulesEngineSettings__MqttBroker
              value: "smarthomepi2"
            - name: RulesEngineSettings__MqttPort
              value: "32004"
            - name: RulesEngineSettings__FaStatusTopic
              value: "cangateway/M1/WEZ/Status/FA_Status"
            - name: RulesEngineSettings__MixerCommandTopics
              value: "commands/MixerController/M1/Mischer1,commands/MixerController/M1/Mischer2"
            - name: RulesEngineSettings__MaxStatusAgeMinutes
              value: "15"
            - name: RulesEngineSettings__EvaluationIntervalSeconds
              value: "60"
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
