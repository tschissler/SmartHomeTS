---
# Defaults for network
gateway: 192.168.178.1
nameservers:
  - 192.168.178.1
  - 1.1.1.1

# Some nodes can be slow to present the sudo prompt on first connection.
# Default Ansible become timeout is ~12s; increase to avoid false failures.
ansible_become_timeout: 60

# Pin k3s version for consistent installs.
k3s_version: v1.34.11+k3s1

# Pin the Longhorn chart version, analog zu k3s_version.
# Wird von plays/install-longhorn.yml gelesen; die Werte selbst stehen in
# templates/longhorn-values.yaml.j2. Longhorn laeuft bewusst ueber Ansible und
# nicht ueber ArgoCD -- Begruendung in docs/gitops-grenze.md im Repo
# SmartHomeDeployments. Upgrades sind dort immer manuell und nie ueberspringend
# (1.10 -> 1.11 -> 1.12), siehe docs/update-strategie.md.
longhorn_helm_version: "1.10.1"

# Ingress hostnames
nextcloud_domain: nextcloud.intern
nextcloud_namespace: nextcloud
nextcloud_service_name: nextcloud
nextcloud_service_port: 8080
