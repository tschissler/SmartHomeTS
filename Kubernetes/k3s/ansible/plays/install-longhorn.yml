---
- name: Install Longhorn storage system
  hosts: k3s_servers
  become: yes
  gather_facts: no
  vars:
    longhorn_namespace: longhorn-system
    longhorn_chart_version: "{{ longhorn_helm_version | default('1.10.1') }}"
    longhorn_data_path: /var/lib/longhorn-data
    longhorn_replica_count: "{{ longhorn_default_replica_count | default(2) }}"
    # Kein `{{ longhorn_node_down_pod_deletion_policy | default(...) }}`: eine Play-Var,
    # die sich selbst referenziert, laeuft in "Recursive loop detected in template".
    # Ueberschreiben geht weiterhin per `-e`, denn extra-vars schlagen Play-Vars.
    longhorn_node_down_pod_deletion_policy: delete-both-statefulset-and-deployment-pod
    # Optional: Pin Longhorn system-managed components (manager, CSI plugin, engine-image, etc.)
    # to specific nodes using a Kubernetes label selector.
    # Example (matches your existing labels): "node.longhorn.io/create-default-disk=true"
    # WARNING: If you pin these components away from a node, pods on that node may no longer
    # be able to mount Longhorn volumes.
    # Ebenfalls ohne Selbstreferenz (siehe oben); leer = kein Pinning, per `-e` setzbar.
    longhorn_system_managed_components_node_selector: ""
    # helm wird gepinnt installiert, NICHT per `curl … get-helm-3 | bash`.
    # Das alte Skript holte bei jedem Lauf die neueste helm-Version von GitHub main --
    # eine rollende Referenz, ausgefuehrt auf einem Cluster-Node. Welche Version dabei
    # herauskam, entschied GitHub. Siehe SmartHomeDeployments #6 und #14.
    # Beim Anheben: Version UND beide Checksummen tauschen, Quelle ist
    # https://get.helm.sh/helm-<version>-linux-<arch>.tar.gz.sha256sum
    helm_version: "v3.20.0"
    helm_checksums:
      amd64: "sha256:dbb4c8fc8e19d159d1a63dda8db655f9ffa4aac1b9a6b188b34a40957119b286"
      arm64: "sha256:bfb14953295d5324d47ab55f3dfba6da28d46c848978c8fbf412d4271bdc29f1"

  tasks:
    - name: Ensure the Longhorn namespace exists
      ansible.builtin.shell: |
        set -o pipefail
        /usr/local/bin/k3s kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml \
          create namespace {{ longhorn_namespace }} --dry-run=client -o yaml \
          | /usr/local/bin/k3s kubectl apply -f -
      args:
        executable: /bin/bash
      run_once: true
      delegate_to: "{{ (groups.get('k3s_servers', []) | first) }}"
      changed_when: false

    - name: Ensure the pinned helm version is installed
      run_once: true
      delegate_to: "{{ (groups.get('k3s_servers', []) | first) }}"
      vars:
        helm_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[helm_uname.stdout | trim] }}"
      block:
        - name: Determine the architecture of the helm host
          ansible.builtin.command: uname -m
          register: helm_uname
          changed_when: false

        - name: Read the installed helm version
          ansible.builtin.command: /usr/local/bin/helm version --short
          register: helm_installed
          changed_when: false
          failed_when: false

        - name: Download the pinned helm archive
          ansible.builtin.get_url:
            url: "https://get.helm.sh/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz"
            dest: "/tmp/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz"
            checksum: "{{ helm_checksums[helm_arch] }}"
            mode: "0600"
          when: helm_version not in (helm_installed.stdout | default(''))

        - name: Install the helm binary to /usr/local/bin
          ansible.builtin.unarchive:
            src: "/tmp/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz"
            dest: /usr/local/bin
            remote_src: true
            include:
              - "linux-{{ helm_arch }}/helm"
            extra_opts:
              - --strip-components=1
            owner: root
            group: root
            mode: "0755"
          when: helm_version not in (helm_installed.stdout | default(''))

        - name: Remove the downloaded helm archive
          ansible.builtin.file:
            path: "/tmp/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz"
            state: absent
          when: helm_version not in (helm_installed.stdout | default(''))

    - name: Add and refresh the Longhorn Helm repository
      ansible.builtin.shell: |
        helm repo add longhorn https://charts.longhorn.io
        helm repo update longhorn
      args:
        executable: /bin/bash
      run_once: true
      delegate_to: "{{ (groups.get('k3s_servers', []) | first) }}"
      changed_when: false
    - name: Ensure the Longhorn values directory exists
      ansible.builtin.file:
        path: /etc/rancher/longhorn
        state: directory
        owner: root
        group: root
        mode: "0755"
      run_once: true
      delegate_to: "{{ (groups.get('k3s_servers', []) | first) }}"

    - name: Render the Longhorn values file
      ansible.builtin.template:
        src: ../templates/longhorn-values.yaml.j2
        dest: /etc/rancher/longhorn/values.yaml
        owner: root
        group: root
        mode: "0644"
      run_once: true
      delegate_to: "{{ (groups.get('k3s_servers', []) | first) }}"

    - name: Install Longhorn via Helm
      ansible.builtin.shell: |
        helm upgrade --install longhorn longhorn/longhorn \
          --namespace {{ longhorn_namespace }} \
          --create-namespace \
          --version {{ longhorn_chart_version }} \
          -f /etc/rancher/longhorn/values.yaml
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      run_once: true
      delegate_to: "{{ (groups.get('k3s_servers', []) | first) }}"
      changed_when: false

    - name: Wait for Longhorn deployment to be ready
      ansible.builtin.shell: |
        /usr/local/bin/k3s kubectl -n {{ longhorn_namespace }} rollout status deployment/longhorn-driver-deployer --timeout=300s
        /usr/local/bin/k3s kubectl -n {{ longhorn_namespace }} rollout status daemonset/longhorn-manager --timeout=300s
      run_once: true
      delegate_to: "{{ (groups.get('k3s_servers', []) | first) }}"
      changed_when: false
      retries: 5
      delay: 10
      register: longhorn_rollout
      until: longhorn_rollout.rc == 0

    - name: Optionally pin Longhorn system-managed components to selected nodes
      ansible.builtin.shell: |
        /usr/local/bin/k3s kubectl -n {{ longhorn_namespace }} patch settings.longhorn.io system-managed-components-node-selector \
          --type merge \
          -p '{"value":"{{ longhorn_system_managed_components_node_selector }}"}'
      when:
        - longhorn_system_managed_components_node_selector is defined
        - longhorn_system_managed_components_node_selector | trim != ''
      run_once: true
      delegate_to: "{{ (groups.get('k3s_servers', []) | first) }}"
      changed_when: false

    - name: Compute Longhorn storage/non-storage node lists from inventory
      ansible.builtin.set_fact:
        longhorn_storage_nodes: "{{ groups.get('longhorn_storage_nodes', []) }}"
        longhorn_all_cluster_nodes: "{{ (groups.get('k3s_servers', []) + groups.get('k3s_agents', [])) | unique }}"
      run_once: true

    - name: Annotate Longhorn storage nodes with disk configuration
      ansible.builtin.shell: |
        /usr/local/bin/k3s kubectl annotate node {{ item }} \
          node.longhorn.io/default-disks-config='[{"path":"{{ longhorn_data_path }}","allowScheduling":true}]' \
          --overwrite
      loop: "{{ longhorn_storage_nodes }}"
      when: longhorn_storage_nodes | length > 0
      run_once: true
      delegate_to: "{{ (groups.get('k3s_servers', []) | first) }}"
      changed_when: false

    - name: Label Longhorn storage nodes for default disk creation
      ansible.builtin.shell: |
        /usr/local/bin/k3s kubectl label node {{ item }} \
          node.longhorn.io/create-default-disk=true \
          --overwrite
      loop: "{{ longhorn_storage_nodes }}"
      when: longhorn_storage_nodes | length > 0
      run_once: true
      delegate_to: "{{ (groups.get('k3s_servers', []) | first) }}"
      changed_when: false

    - name: Label non-storage nodes to prevent default disk creation
      ansible.builtin.shell: |
        /usr/local/bin/k3s kubectl label node {{ item }} \
          node.longhorn.io/create-default-disk=false \
          --overwrite
      loop: "{{ longhorn_all_cluster_nodes | difference(longhorn_storage_nodes) }}"
      when:
        - longhorn_all_cluster_nodes | length > 0
        - (longhorn_all_cluster_nodes | difference(longhorn_storage_nodes)) | length > 0
      run_once: true
      delegate_to: "{{ (groups.get('k3s_servers', []) | first) }}"
      changed_when: false

    - name: Display Longhorn installation status
      ansible.builtin.debug:
        msg: |
          ========================================================
          Longhorn Installation Complete
          ========================================================
          Namespace:        {{ longhorn_namespace }}
          Data Path:        {{ longhorn_data_path }}
          Replica Count:    {{ longhorn_replica_count }}
          
          Check Status:
          kubectl -n {{ longhorn_namespace }} get pods
          kubectl get storageclass
          
          Longhorn wird jetzt als default StorageClass verwendet.
          Neue PVCs nutzen automatisch Longhorn für replizierte Speicherung.
          
          Optional: Longhorn UI via Port-Forward:
          kubectl port-forward -n {{ longhorn_namespace }} svc/longhorn-frontend 8080:80
          Dann erreichbar: http://localhost:8080
          ========================================================
      run_once: true
      delegate_to: localhost
      become: false
