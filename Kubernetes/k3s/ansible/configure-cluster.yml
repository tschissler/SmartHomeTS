---
# Post-provision cluster configuration (add-ons).
# Run this AFTER cluster.yml has completed successfully and k3s is stable.
#
# Two-Phase Install Strategy:
#   Phase 1: cluster.yml      â†’ OS prep, k3s install
#   Phase 2: configure-cluster.yml â†’ kube-vip, storage, services
#
# Order matters:
# 0. kube-vip (MUST be first - provides VIPs for LoadBalancer services)
# 1. Longhorn storage (prep nodes â†’ prep storage â†’ install)
# 2. Services that need storage (AdGuard with PVC)
# 3. Ingress configuration (needs Traefik + services ready)

# Step 0a: Einheitliche Zeitzone (UTC) auf allen Nodes
# Ohne das laufen die Node-Journale in zwei Zeitzonen auseinander (k3snode1/2 UTC,
# k3snode3-6 Europe/Berlin) und jede Korrelation ueber Nodes hinweg hat einen
# stillen Versatz von 1-2 h. Siehe SmartHomeDeployments Issue #36.
- import_playbook: plays/configure-node-timezone.yml

# Step 0b: Memory-Eviction für den kubelet
# k3s setzt nur imagefs/nodefs-Schwellen und ersetzt damit den kubelet-Default-Satz;
# `memory.available` fehlt dadurch ganz. Ohne dieses Play räumt bei RAM-Druck nicht
# der kubelet geordnet, sondern der Kernel-OOM-Killer. SmartHomeDeployments #34.
- import_playbook: plays/configure-kubelet-eviction.yml

# Step 0: kube-vip for API and Service VIPs
# Must run BEFORE any LoadBalancer services (AdGuard, Traefik, etc.)
- import_playbook: plays/configure-kubevip.yml

# Step 1: Longhorn replicated storage
#
# NOTE: install-longhorn.yml ist hier bewusst NICHT mehr eingehaengt
# (SmartHomeDeployments #6, Entscheidung 2026-09-19).
# Es fuehrt `helm upgrade --install` auf den Storage-Layer aus. Eingehaengt lief das
# bei JEDEM Lauf dieses Playbooks mit -- auch wenn man nur die Zeitzone (Step 0a) oder
# die kubelet-Eviction (Step 0b) setzen wollte. Ein Helm-Upgrade auf Longhorn darf kein
# Beifang einer Node-Konfiguration sein, deshalb wird es ab jetzt bewusst aufgerufen:
#
#   ansible-playbook plays/install-longhorn.yml -K
#
# Die beiden prepare-Plays bleiben eingehaengt: sie richten iSCSI, Kernel-Module und
# die Datenpartition auf den Nodes ein, sind also echte Node-Vorbereitung und aendern
# nichts an der laufenden Longhorn-Installation.
- import_playbook: plays/prepare-longhorn-nodes.yml
- import_playbook: plays/prepare-longhorn-storage.yml
- import_playbook: plays/expose-longhorn-ui.yml

# Step 1b: Minio object storage service
- import_playbook: plays/prepare-minio-storage.yml

# Step 2: Core services
- import_playbook: plays/install-adguard-home.yml

# Step 2a: DNS rewrites in AdGuard for internal hostnames
- import_playbook: plays/configure-adguard-rewrites.yml

# Step 2b: In-cluster DNS forwarding for internal hostnames
# Pods use CoreDNS (kube-dns). This forwards the .intern zone to AdGuard
# so pods can resolve internal services like argocd.intern/longhorn.intern.
- import_playbook: plays/configure-coredns-intern-forward.yml

# Step 2b-2: CoreDNS redundant machen
# k3s liefert CoreDNS mit replicas: 1 aus. Das ist die einzige Komponente, deren
# Ausfall JEDEN Pod trifft (Namensaufloesung), deshalb zwei Replicas + PDB.
# Muss nach jedem k3s-Neustart nachgezogen werden, weil der Addon-Controller das
# Manifest mit replicas: 1 neu anwendet -- laeuft daher auch in upgrade-k3s.yml.
- import_playbook: plays/configure-coredns-replicas.yml

# Step 2c: Node-level split-DNS for .intern zone
# Configures systemd-resolved on each node to route *.intern queries to
# AdGuard Home via a drop-in file. Other DNS traffic stays on Fritz!Box.
# Prerequisite: AdGuard Home must be running (Step 2) with *.intern rewrites.
- import_playbook: plays/configure-node-dns.yml

# Step 3: Trust cluster CA on all nodes
# Extracts cluster-ca-secret from cert-manager and installs it in the OS trust
# store on every node so containerd can pull images from forgejo.intern.
# Prerequisite: ArgoCD + cert-manager must be running and ClusterCA app healthy.
- import_playbook: plays/trust-cluster-ca.yml

# Step 4: Ingress routes (host-based routing on shared VIP)
# NOTE: configure-ingress-hostnames.yml and configure-traefik-mqtt.yml are now
# managed by ArgoCD Application: SmartHomeDeployments/Traefik.yaml
# This configures Traefik MQTT and SMB entrypoints via HelmChartConfig.
# - import_playbook: plays/configure-ingress-hostnames.yml
# - import_playbook: plays/configure-traefik-mqtt.yml
# - import_playbook: plays/configure-traefik-smb.yml
